<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUBO 3D - Catálogo e Emuladores</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        header {
            margin-bottom: 30px;
        }
        h1 {
            color: #00ffcc;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            width: 280px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.03);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
        }
        .card h3 {
            margin: 15px 0 10px;
            color: #ffcc00;
        }
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #00ffcc;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #00cca3;
        }
    </style>
</head>
<body>

    <header>
        <h1>KUBO 3D - Catálogo de Jogos e Colecionáveis</h1>
        <p>Explore impressões 3D exclusivas e jogue títulos retrô diretamente no navegador.</p>
    </header>

    <main class="container">
        <!-- Exemplo de Item do Catálogo integrado com Jogo -->
        <div class="card">
            <!-- Insira o caminho da imagem de capa atualizada aqui -->
            <img src="assets/cover_supermetroid.jpg" alt="Super Metroid Capa">
            <h3>Super Metroid</h3>
            <p>Portfólio de cartuchos impressos em 3D com NFC integrado e emulador embutido.</p>
            <!-- Substitua pelo link do jogo ou emulador atualizado -->
            <a href="emulator.html?game=super_metroid" class="btn" target="_blank">Jogar / Ver Detalhes</a>
        </div>

        <!-- Adicione novos itens do catálogo aqui conforme necessário -->
    </main>

    <footer>
        <p>&copy; 2026 KUBO 3D - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
