<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Metroid - Kubo Touch</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            min-height: 100%; 
            background-color: #121212; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            overflow-x: hidden; 
        }
        
        header { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            text-align: center; 
            padding: 15px; 
            background: #1e1e1e; 
            z-index: 5; 
        }
        
        .badge { 
            background: #333333; 
            color: #fff; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 14px; 
            border: 1px solid #555; 
        }
        
        #game-card { 
            width: 100%;
            max-width: 440px; 
            margin: 80px 20px 20px 20px; 
            background: #1e1e1e; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            perspective: 1000px;
        }
        
        .cartridge-wrapper {
            width: 100%;
            padding: 25px 10px 15px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: pointer;
        }

        .snes-cart-body {
            width: 380px;
            height: 220px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transform: translateZ(20px);
            filter: drop-shadow(0 15px 22px rgba(0,0,0,0.7));
        }

        .cart-wing {
            width: 58px;
            height: 204px;
            background: linear-gradient(180deg, #9f9fa9 0%, #8e8e98 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px 0 34px 0;
            box-shadow: inset 0 2px 3px rgba(255,255,255,0.4), inset 0 -4px 6px rgba(0,0,0,0.3);
        }

        .cart-wing.left {
            border-radius: 4px 0 0 4px;
            border-right: 1px solid #6b6b74;
        }

        .cart-wing.right {
            border-radius: 0 4px 4px 0;
            border-left: 1px solid #6b6b74;
        }

        .wing-groove {
            width: 100%;
            height: 4px;
            background: #61616a;
            border-bottom: 1px solid #b8b8c2;
        }

        .cart-screw {
            position: absolute;
            bottom: 8px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle, #666 25%, #1a1a1a 85%);
            box-shadow: inset 0 1px 2px #000, 0 1px 1px rgba(255,255,255,0.45);
        }
        .cart-wing.left .cart-screw { left: 26px; }
        .cart-wing.right .cart-screw { right: 26px; }

        .cart-center-block {
            width: 264px;
            height: 220px;
            background: linear-gradient(180deg, #acacb6 0%, #9696a0 100%);
            border-radius: 6px 6px 2px 2px;
            box-shadow: 
                -4px 0 7px rgba(0,0,0,0.28),
                4px 0 7px rgba(0,0,0,0.28),
                inset 0 2px 4px rgba(255,255,255,0.6),
                inset 0 -3px 6px rgba(0,0,0,0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 12px;
            z-index: 2;
        }

        /* CAPA ALINHADA */
        .cart-label-box {
            width: 100%;
            height: 112px;
            background-color: #0b0b0b;
            background-image: url('super-metroid-boxart.webp');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 0 0 12px 12px;
            border: 2px solid #141414;
            border-top: none;
            box-shadow: 0 3px 5px rgba(0,0,0,0.55);
            position: relative;
            overflow: hidden;
        }

        .cart-label-box::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
        }
        .snes-cart-body:hover .cart-label-box::after {
            left: 150%;
        }

        .cart-lock-slot {
            width: 236px;
            height: 18px;
            margin-top: 28px;
            background: linear-gradient(180deg, #65656e 0%, #83838c 100%);
            border-radius: 9px;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.55), 0 1px 1px rgba(255,255,255,0.45);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cart-lock-inner {
            width: 78px;
            height: 11px;
            background: #777780;
            border-radius: 2px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.45);
        }

        .content { padding: 20px; }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #e5e5e5; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .meta-info { display: flex; gap: 10px; margin-bottom: 15px; font-size: 13px; color: #aaa; }
        .description { font-size: 14px; line-height: 1.5; color: #ddd; margin-bottom: 15px; }
        .details { font-size: 13px; color: #bbb; margin-bottom: 20px; }
        .details ul { padding-left: 20px; margin: 0; }
        
        .btn-play { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            background: #2b2b2b; 
            color: #fff; 
            border: 1px solid #555; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 18px; 
            cursor: pointer; 
            text-align: center; 
            outline: none;
            position: relative;
            z-index: 10;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-play:hover { background: #3b3b3b; transform: translateY(-2px); }
        .btn-play:active { background: #1f1f1f; transform: translateY(0); }

        #game-container { 
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            z-index: 99999;
            background: #000;
        }
        #game { width: 100%; height: 100%; }

        @media (max-width: 400px) {
            .snes-cart-body {
                transform: scale(0.85) translateZ(20px);
            }
        }
    </style>
</head>
<body>

    <header id="header-bar">
        <span class="badge">KUBO TOUCH</span>
    </header>

    <div id="game-card">
        <div class="cartridge-wrapper" id="cartridge3d">
            <div class="snes-cart-body">
                <div class="cart-wing left">
                    <div class="wing-groove"></div>
                    <div class="wing-groove"></div>
                    <div class="wing-groove"></div>
                    <div class="wing-groove"></div>
                    <div class="wing-groove"></div>
                    <div class="cart-screw"></div>
                </div>

                <div class="cart-center-block">
                    <div class="cart-label-box"></div>
                    <div class="cart-lock-slot">
                        <div class="cart-lock-inner"></div>
                    </div>
                </div>

                <div class="cart-wing right">
                    <div class="wing-groove"></div>
                    <div class="wing-groove"></div>
                    <div class="wing-groove"></div>
                    <div class="wing-groove"></div>
                    <div class="wing-groove"></div>
                    <div class="cart-screw"></div>
                </div>
            </div>
        </div>
        
        <div class="content">
            <h1>Super Metroid</h1>
            
            <div class="meta-info">
                <span>🎮 1 Jogador</span>
                <span>📅 1994</span>
                <span>🕹️ Nintendo</span>
            </div>

            <p class="description">
                Explore o planeta Zebes em uma aventura de exploração e ação aclamada pela crítica. Ajude a caçadora de recompensas Samus Aran a recuperar as larvas de Metroid roubadas pelos Piratas Espaciais.
            </p>

            <div class="details">
                <ul>
                    <li><strong>🕹️ Gênero:</strong> Action / Adventure</li>
                </ul>
            </div>

            <button id="play-btn" class="btn-play">JOGAR AGORA</button>
        </div>
    </div>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        const card = document.getElementById('game-card');
        const cartridge = document.getElementById('cartridge3d');

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const rotateX = (-y / 14).toFixed(2);
            const rotateY = (x / 14).toFixed(2);
            
            cartridge.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
        });

        card.addEventListener('mouseleave', () => {
            cartridge.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            cartridge.style.transition = 'transform 0.5s ease';
        });

        card.addEventListener('mouseenter', () => {
            cartridge.style.transition = 'none';

            window.EJS_gameName = 'Super Metroid';
           <script>
    const card = document.getElementById('game-card');
    const cartridge = document.getElementById('cartridge3d');

    card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;

        const rotateX = (-y / 14).toFixed(2);
        const rotateY = (x / 14).toFixed(2);

        cartridge.style.transform =
            `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
    });

    card.addEventListener('mouseleave', () => {
        cartridge.style.transform =
            'rotateX(0deg) rotateY(0deg) scale(1)';
        cartridge.style.transition = 'transform 0.5s ease';
    });

    card.addEventListener('mouseenter', () => {
        cartridge.style.transition = 'none';
    });

    document.getElementById('play-btn').addEventListener('click', function () {

        document.getElementById('header-bar').style.display = 'none';
        document.getElementById('game-card').style.display = 'none';

        const container = document.getElementById('game-container');
        container.style.display = 'block';

        // Configuração EmulatorJS
        window.EJS_player = '#game';
        window.EJS_core = 'snes9x';
        window.EJS_gameName = 'Super Metroid';
        window.EJS_color = '#4b4b56';

        window.EJS_startOnLoaded = true;
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

        // IMPORTANTE: Nome exato do arquivo da ROM
        window.EJS_gameUrl = './super-metroid.smc';

        // Inicialização do EmulatorJS
        const script = document.createElement('script');

        script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        script.async = true;

        script.onerror = function () {
            alert('Erro ao carregar o EmulatorJS. Verifique sua conexão.');
        };

        document.body.appendChild(script);
    });
</script>
